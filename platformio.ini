[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Board configuration for ESP32-C3 SuperMini
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs

; USB CDC on boot enables native USB-C Serial monitor on GPIO 18/19
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 460800

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.1.5
    https://github.com/mathieucarbou/AsyncTCP.git
