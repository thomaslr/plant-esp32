[build]
target = "riscv32imc-esp-espidf"

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_SYS_ROOT_CRATE = "plant-firmware"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "plant-firmware/sdkconfig.defaults", relative = true }
